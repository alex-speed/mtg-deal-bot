# MTG deal bot (sealed product).
#
# Scheduled runs are DRY RUNS: they build the report, attach it to the run, publish it to GitHub
# Pages and send no email. They tag deals by how long ago they were first found (NEW, RECENT, PRICE DROP).
# The list of reported deals is kept in seen-sealed.json, and the web pages are kept in the docs folder
# (built by build_site.py). This workflow commits both back to the repository after each scheduled run.
#
# The Re-scan button on the published page starts this workflow with "dry run" and "only new" ticked.
#
# Manual runs show every deal and leave the history and the web page alone, unless you tick
# "only new".
# To get the report by email, run this workflow by hand and untick "dry run".
#
# Safe to run in production? Yes. It only reads public web pages, and sends one email only when you
# untick dry run by hand. It changes nothing in your tenant or on any server, and the only files it
# writes to the repository are seen-sealed.json and the docs folder. Use a personal repository for it.

name: MTG deals

on:
  schedule:
    # GitHub cron is always UTC. 21:17 UTC is 7:47am Adelaide during daylight saving
    # (ACDT) and 6:47am once daylight saving ends in April (ACST).
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report but do not send the email"
        type: boolean
        default: true
      only_new:
        description: "Tag new deals, update the history and publish the page (scheduled runs always do this)"
        type: boolean
        default: false

# Needed so the run can save seen-sealed.json and the docs folder.
permissions:
  contents: write

# Never run two copies at once, because both would write the history file.
concurrency:
  group: mtg-deals
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repository files
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests and the HTML reader
        run: pip install requests beautifulsoup4 lxml

      # Only a manual run with dry run unticked sends an email.
      - name: Run bot and send email
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          ONLY_NEW: ${{ inputs.only_new && 'highlight' || '' }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Option A: Microsoft Graph. Used when SMTP_HOST is not set.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          # Option B: SMTP, for example Gmail with an app password.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python mtg_deal_bot.py

      # Scheduled runs, and manual runs with dry run ticked, build report.html and attach it to the run.
      - name: Run bot (dry run)
        if: ${{ github.event_name == 'schedule' || inputs.dry_run }}
        env:
          ONLY_NEW: ${{ (github.event_name == 'schedule' || inputs.only_new) && 'highlight' || '' }}
        run: python mtg_deal_bot.py --dry-run

      - name: Attach the report
        if: ${{ github.event_name == 'schedule' || inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: report.html
          retention-days: 14

      # Builds the styled web pages with build_site.py, then saves them and the list of reported deals.
      # It runs only after the bot finished without an error.
      # The RESCAN_ settings switch on the Re-scan button on the page. RESCAN_INPUTS must match what
      # makes this step run (dry run ticked and only new ticked).
      - name: Publish report and save history
        if: ${{ github.event_name == 'schedule' || inputs.only_new }}
        env:
          SITE_TITLE: MTG sealed deals
          SITE_KICKER: Sealed product scan
          SITE_CURRENT: Sealed
          SITE_NAV: "Sealed|https://alex-speed.github.io/mtg-deal-bot/;Singles|https://alex-speed.github.io/mtg-singles-daily/"
          RESCAN_REPO: ${{ github.repository }}
          RESCAN_WORKFLOW: mtg-deals.yml
          RESCAN_REF: ${{ github.ref_name }}
          RESCAN_INPUTS: "dry_run=true,only_new=true"
          RESCAN_EXPECT: "180"
        run: |
          set -euo pipefail
          python build_site.py
          [ -d docs ] && git add docs || true
          [ -f seen-sealed.json ] && git add seen-sealed.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update report and reported deals"
          git pull --rebase
          git push
