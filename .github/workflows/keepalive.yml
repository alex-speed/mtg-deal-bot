# Keepalive: GitHub switches off scheduled workflows in a repository that has had no
# commits or pushes for 60 days. This makes one small commit a month so the daily bot
# keeps running.
#
# Safe to run in production? Yes. It only edits keepalive.txt in this repository.

name: Keepalive

on:
  schedule:
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record a commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "Keepalive"
          git push
